name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          # a tag push publishes that tag's version only: v0.4.9 must hold version 0.4.9
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
          # a manual run from a branch publishes :sha-<commit> only, never a release tag
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$version"; else tag="sha-${GITHUB_SHA::7}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/va24d/align-agent:${{ steps.v.outputs.tag }}
            ${{ github.ref_type == 'tag' && 'ghcr.io/va24d/align-agent:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/VA24d/align-agent
            org.opencontainers.image.description=ALIGN: keep coding agents' views of their files current, and find stale edits in agent trajectories
            org.opencontainers.image.licenses=Apache-2.0
