name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --disable-pip-version-check pytest -e .
      - name: Tests
        # TODO: add -W error::ResourceWarning once the engine closes its .lock handle
        run: python -m pytest -q tests/
      - name: Shell scripts parse
        if: runner.os != 'Windows'
        run: |
          bash -n claude-plugin/scripts/audit.sh
          sh -n claude-plugin/scripts/hook.sh
      - name: Hook launcher under Git Bash
        if: runner.os == 'Windows'
        shell: bash
        env:
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/plugin data
        run: |
          mkdir -p "$RUNNER_TEMP/ws"
          ws="$(cygpath -m "$RUNNER_TEMP/ws")"
          printf '{"hook_event_name":"SessionStart","session_id":"ci","cwd":"%s","source":"startup"}' "$ws" \
            | sh claude-plugin/scripts/hook.sh
          test -s "$CLAUDE_PLUGIN_DATA/python"  # an interpreter was found and cached
          test -d "$CLAUDE_PLUGIN_DATA/sessions/ci"  # and hook.py ran
          printf '{"hook_event_name":"PostToolUse","session_id":"ci","cwd":"%s","tool_name":"Bash","tool_input":{"command":"true"},"tool_response":{}}' "$ws" \
            | sh claude-plugin/scripts/hook.sh  # second call: the cached interpreter
          test ! -s "$CLAUDE_PLUGIN_DATA/errors.log" || { cat "$CLAUDE_PLUGIN_DATA/errors.log"; exit 1; }
      - name: Copilot PowerShell hook command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = Get-Content integrations/copilot/align-agent.json -Raw | ConvertFrom-Json
          $ws = Join-Path $env:RUNNER_TEMP "cpws"; New-Item -ItemType Directory -Force $ws | Out-Null
          $env:ALIGN_STATE = Join-Path $env:RUNNER_TEMP "cpstate"
          '{"sessionId":"cp","cwd":"' + ($ws -replace '\\','/') + '","source":"new"}' | pwsh -NoProfile -Command $cfg.hooks.sessionStart[0].powershell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:ALIGN_STATE "sessions/cp"))) { throw "sessionStart hook did not run" }
          $out = '{"sessionId":"cp","cwd":"' + ($ws -replace '\\','/') + '","toolName":"powershell","toolArgs":"{\"command\":\"Get-Date\"}"}' | pwsh -NoProfile -Command $cfg.hooks.preToolUse[0].powershell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "preToolUse output: [$out]"
