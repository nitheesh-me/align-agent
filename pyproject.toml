[build-system]
requires = ["setuptools>=77"]  # 77: license as an SPDX expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "align-agent"
version = "0.4.9"
description = "Find edits a coding agent made against a stale view of a file, and keep agents' views current with a write-through hook (Claude Code, any hook system, any MCP client, mini-swe-agent)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
run = [
  "mini-swe-agent==2.4.6",
  "Jinja2==3.1.6",
  "PyYAML==6.0.3",
  "pydantic==2.13.4",
]

[project.scripts]
align-agent = "align_agent.cli:main"
align-agent-wt = "align_agent.writethrough.protocol:main"
align-agent-mcp = "align_agent.writethrough.mcp_server:main"
align-agent-claude-hook = "align_agent.writethrough.claude_code:main"
align-agent-hook = "align_agent.writethrough.hooks:main"

[tool.setuptools.packages.find]
include = ["align_agent*"]

[tool.setuptools.package-data]
"*" = ["*.py"]
"align_agent" = ["examples/*.json"]
